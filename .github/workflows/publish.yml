name: Update and publish The Kavanaugh Daily
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '35 9 * * *'
    - cron: '10 18 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public news feeds
        run: python scripts/update_news.py
      - name: Install neural speech engine
        run: python -m pip install --disable-pip-version-check "kokoro-onnx>=0.4,<2" soundfile imageio-ffmpeg
      - name: Cache neural speech model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kokoro-voice
          key: kokoro-model-files-v1.1-2026
      - name: Download neural speech model
        env:
          KOKORO_MODEL_DIR: ${{ runner.temp }}/kokoro-voice
        run: |
          mkdir -p "$KOKORO_MODEL_DIR"
          if [ ! -s "$KOKORO_MODEL_DIR/kokoro-v1.0.onnx" ]; then
            curl --fail --location --retry 3 --output "$KOKORO_MODEL_DIR/kokoro-v1.0.onnx" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx"
          fi
          if [ ! -s "$KOKORO_MODEL_DIR/voices-v1.0.bin" ]; then
            curl --fail --location --retry 3 --output "$KOKORO_MODEL_DIR/voices-v1.0.bin" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin"
          fi
      - name: Generate natural-sounding news audio
        env:
          KOKORO_MODEL_DIR: ${{ runner.temp }}/kokoro-voice
        run: python scripts/generate_audio.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
